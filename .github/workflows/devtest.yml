# TEMPORARY: drives the launcher on an emulator to debug gestures. Removed before merge.
name: devtest
on:
  push:
    branches: ['fix/**']
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/devtest/run.sh
      - name: Push results to a throwaway branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd devtest-out
          git init -q
          git checkout -q -b devtest-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "results ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" devtest-results
