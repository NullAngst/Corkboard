version: 2
updates:
  # The Android Gradle Plugin version in build.gradle.kts and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly

  # actions/checkout, actions/setup-java, gradle/actions, actions/upload-artifact, actions/attest-build-provenance.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
